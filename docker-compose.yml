version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fundedpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundedpro
      POSTGRES_PASSWORD: fundedpro
      POSTGRES_DB: fundedpro
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fundedpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-data:
